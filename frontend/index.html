<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0c29" />
    <meta name="description" content="Self-Service ML Notebook Provisioning System — Launch, manage, and scale Jupyter notebooks on demand." />

    <!-- Preconnect for fonts (render-blocking elimination) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>ML Notebooks — Self-Service Provisioning</title>

    <!--
      Inline critical CSS: renders the skeleton loader before React hydrates.
      This prevents a flash of unstyled blank white page on slow connections.
    -->
    <style>
      *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body, #root {
        height: 100%;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Initial paint skeleton ─────────────────────────── */
      #app-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      /* Hidden once React mounts (React removes #app-shell) */
      #root:not(:empty) + #app-shell,
      #root[data-hydrated] ~ #app-shell {
        opacity: 0;
        pointer-events: none;
      }

      .shell-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 32px rgba(99, 102, 241, 0.45);
      }

      .shell-logo svg { display: block; }

      .shell-bar-wrap {
        width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
      }

      .shell-bar {
        height: 100%;
        width: 60%;
        background: linear-gradient(90deg, transparent, #6366f1, #a855f7, transparent);
        border-radius: 99px;
        animation: shimmer 1.4s ease-in-out infinite;
      }

      @keyframes shimmer {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(267%); }
      }

      .shell-text {
        color: #94a3b8;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.03em;
      }

      /* Ambient glow behind logo */
      .shell-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
        filter: blur(50px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- React mounts here -->
    <div id="root"></div>

    <!--
      Pure-HTML skeleton shown before React's first paint.
      React's PageLoader component takes over once JS loads.
      This element can be left in the DOM — PageLoader's fixed overlay
      sits on top of it at z-index 9999 until the page is ready.
    -->
    <div id="app-shell" aria-label="Loading application" role="status">
      <div class="shell-glow" aria-hidden="true"></div>

      <!-- Logo mark -->
      <div class="shell-logo" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6"  y="6"  width="10" height="10" rx="2" fill="white" fill-opacity="0.9"/>
          <rect x="20" y="6"  width="10" height="10" rx="2" fill="white" fill-opacity="0.55"/>
          <rect x="6"  y="20" width="10" height="10" rx="2" fill="white" fill-opacity="0.55"/>
          <rect x="20" y="20" width="10" height="10" rx="2" fill="white" fill-opacity="0.9"/>
        </svg>
      </div>

      <!-- Shimmer bar -->
      <div class="shell-bar-wrap" aria-hidden="true">
        <div class="shell-bar"></div>
      </div>

      <p class="shell-text">Loading…</p>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Hide the HTML skeleton once React mounts to avoid double loaders
      document.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => {
          const root = document.getElementById('root');
          const shell = document.getElementById('app-shell');
          if (root && root.children.length > 0 && shell) {
            shell.style.opacity = '0';
            shell.style.pointerEvents = 'none';
            setTimeout(() => shell.remove(), 400);
            observer.disconnect();
          }
        });
        const root = document.getElementById('root');
        if (root) observer.observe(root, { childList: true });
      });
    </script>
  </body>
</html>
