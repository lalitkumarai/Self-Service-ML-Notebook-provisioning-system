apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-backend
  template:
    metadata:
      labels:
        app: ml-backend
    spec:
      serviceAccountName: ml-backend-sa
      containers:
      - name: ml-backend
        image: ml-backend:latest
        imagePullPolicy: Always # Use Always for cloud deployments so it fetches new tags
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: ml-backend-config
        - secretRef:
            name: ml-backend-secret
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ml-backend
spec:
  selector:
    app: ml-backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP # Use ClusterIP for backend, should not be exposed directly to internet
