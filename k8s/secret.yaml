apiVersion: v1
kind: Secret
metadata:
  name: ml-backend-secret
type: Opaque
stringData:
  # In a real cloud environment, use sealed secrets or AWS Secrets Manager / GCP Secret Manager
  # For this deployment, we apply it directly using stringData
  JWT_SECRET: "production_super_secure_jwt_secret_change_me_in_prod"
  # Add cloud provider credentials here if you choose to not use IAM roles
