apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-backend-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: ml-backend-role
rules:
# Core API Group: Pods, PVCs, Services
- apiGroups: [""]
  resources: ["pods", "persistentvolumeclaims", "services"]
  verbs: ["create", "delete", "get", "list", "watch"]
# Apps API Group: Deployments (required since backend creates Deployments)
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-backend-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: ml-backend-sa
  namespace: default
roleRef:
  kind: Role
  name: ml-backend-role
  apiGroup: rbac.authorization.k8s.io
